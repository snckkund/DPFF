input {
  http {
    port => 5044
    codec => json
  }
}
filter {
  if [source] == "github" {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "github" }
    }
    date {
      match => [ "created_at", "ISO8601" ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }
  
  if [source] == "jenkins" {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "jenkins" }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }
  
  if [source] == "harbor" {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "harbor" }
    }
    date {
      match => [ "op_time", "UNIX" ]
      target => "@timestamp"
    }
  }
  
  # Always preserve original timestamp
  mutate {
    copy => { "@timestamp" => "timestamp_normalized" }
  }
}
output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_prefix]}-logs-%{+YYYY.MM.dd}"
  }
}
