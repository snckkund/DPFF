apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
      annotations:
        build.id: "${BUILD_ID}"
        git.commit: "${GIT_COMMIT}"
    spec:
      containers:
      - name: myapp
        image: harbor.local/myapp:latest
        ports:
        - containerPort: 3000
        env:
        - name: BUILD_ID
          value: "${BUILD_ID}"
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  selector:
    app: myapp
  ports:
  - port: 80
    targetPort: 3000
